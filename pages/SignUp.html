                <main>
                    <section class="formbody">
                        <div class="signup-form" id="form">
                            <form action="signup">
                                <div class="input-Container">
                                    <label for="name">First Name:</label>
                                    <input type="name" name="" id="name"required>
                                    <span class="error" id="nameError"></span>
                                    <br>
                                    <label for="name">Middle Name:</label>
                                    <input type="name" name="" id="name">
                                    <br>
                                    <label for="name" >Last Name:</label>
                                    <input type="name" name="" id="name"required>
                                    <br>
                                    <label for="image">Profile Image</label>
                                    <div class="upload-container">    
                                        <input type="file" id="fileInput" accept="image/*">
                                        <img id="preview" src="" alt="Image Preview" style="display:none; max-width:300px;">
                                    </div>
                                    <br>
                                    <label for="phone-number">Phone No.:</label>
                                    <input type="text" name="" id="">
                                    <br>
                                    <label for="number">Alternate Phone no.:</label>
                                    <input type="text" name="" id="">
                                    <br>
                                    <label for="email">Email-Id:</label>
                                    <input type="text"id="email">
                                    <span class="error" id="emailError"></span>
                                    <br>
                                    <label for="email">Alternate Email-Id:</label>
                                    <input type="text" id="email">
                                    <br>
                                    <label for="date">Date of Birth:</label>
                                    <input type="date" id="DateOfBirth" required>
                                    <br>
                                    <label for="name">Gender:</label>
                                    <input type="radio" name="gender" value="Male">Male
                                    <input type="radio" name="gender" value="Female">Female
                                    <input type="radio" name="gender" value="Others">Others
                                    <br><br>
                                    <label for="address">Address</label>
                                    <address>
                                        <input type="text" id="address" placeholder="Address" required>
                                        <span class="error" id="addressError"></span>
                                        
                                        <select id="state" required>
                                            <option value="">Select State</option>
                                        </select>
                                        <span class="error" id="stateError"></span>
                                        
                                        <select id="city" required>
                                            <option value="">Select City</option>
                                        </select>
                                        <span class="error" id="cityError"></span>
                                        
                                        <input type="text" id="zip" placeholder="ZIP Code" required>
                                        <span class="error" id="zipError"></span>
                                    </address>
                                    <br>
                                    <label for="password" >Password</label>
                                    <input type="password"id="password" required>
                                    <span class="error" id="passwordError"></span>
                                    <br>
                                    <label for="password">Confirm password.</label>
                                    <input type="password"id="ConfirmPassword"required>
                                    <span class="error" id="ConfirmPasswordError"></span>
                                    <br>
                                </div>
                                <div class="signup-button-container">
                                    <button type="submit" action="get-detail">Create Account</button>
                                    OR
                                    <button type="reset" action="reset">Reset</button>
                                    <br><br>
                                    <h2>Already have an account??</h2>
                                    <a href="loginpage.html"><button type="login" action="login" >Login</button></a>                               
                                </div>
                            </form>
                        </div>
