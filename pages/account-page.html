<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Account Profile</title>
  <link rel="stylesheet" href="../main page style.css">
  <script src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js" type="module"></script>
  <script src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js" nomodule></script>
  <style>
    .profile-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }
    .profile-card {
      background: #fff;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      border-radius: 16px;
      padding: 2rem;
      max-width: 500px;
      width: 100%;
    }
    .profile-image {
      text-align: center;
      margin-bottom: 20px;
    }
    .profile-image img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #007bff;
    }
    .upload-label {
      display: inline-block;
      margin-top: 10px;
      cursor: pointer;
      color: #007bff;
      text-decoration: underline;
      font-size: 0.9rem;
    }
    .profile-details label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
    }
    .profile-details input,
    .profile-details textarea {
      width: 100%;
      padding: 10px;
      margin-top: 4px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }
    .update-btn {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
    }
    .update-btn:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>

  <!-- Include your existing header/sidebar here if needed -->
<header class="header">
        <span class="video-container" id="logo">
            <a href="../index.html" class="logo">
            <video autoplay loop muted playsinline width="120">
                <source src="..\animation\logo.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            </a>
        </span>
        
        <div class="search-container">
            <input type="text" class="search-input" placeholder="Search for products">
            <button class="search-button">
            <span>Search</span>
            <ion-icon name="search"></ion-icon>
            </button>
        </div>

        <div class="nav-links">
            <big>
                    <a href="../pages/contacts.html"><ion-icon name="Call"></ion-icon><big> Contacts</a>
                    <a href="../pages/account.html"> <ion-icon name="person-circle-outline"></ion-icon> <big>Account</big></a>
                    <a href="../pages/order.html"><ion-icon name="Cube-outline"></ion-icon> Orders</a>
                    <a href="../pages/cart.html"><ion-icon name="cart-outline"></ion-icon> Cart</a>
                    <a href="../pages/ChatBot.html"><ion-icon name="help-circle-outline"></ion-icon> Help</a>
                    <a href="../pages/about.html"><ion-icon name="document-text"></ion-icon>About Us</a>
            </big>
        </div>
     

        <div class="auth-buttons">
            <a href="loginpage.html"><button class="login-btn">Login</button></a>
            <a href="SignUp.html"><button class="signup-btn">Sign Up</button></a>
        </div>

        
        
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    </header>
    
    <nav class="sidebar">
        <button class="close-btn" onclick="toggleMenu()">&times;</button>
        <h3 style="padding: 10px;">Menu</h3>
        <ul>
            <big>
                <li><a href="../index.html"><ion-icon name="Home"></ion-icon> Home</a></li>
                <li><a href="../pages/contacts.html"><ion-icon name="call"></ion-icon> Contact Us</a></li>
                <li><a href="../pages/order.html"><ion-icon name="Cube-outline"></ion-icon> Orders</a></li>
                <li><a href="../pages/cart.html"><ion-icon name="cart"></ion-icon> Cart</a></li>
                <li><a href="../pages/account.html"><ion-icon name="person-circle-outline"></ion-icon> Account</a></li>
                <li><a href="../pages/about.html"><ion-icon name="document-text"></ion-icon> About</a></li>
            </big>
        </ul>

        <div class="bottom-links">
            <ul>
                <big>
                    <li><a href="../pages/ChatBot.html"><ion-icon name="help-circle-outline"></ion-icon> Help</a></li>
                </big>
            </ul>
        </div>

        <div class="auth-buttons-sidebar">
            <a href="loginpage.html"><button class="Auth-login-btn">Login</button></a>
            <a href="SignUp.html"><button class="Auth-signup-btn">Sign Up</button></a>
        </div>
    </nav>

  <main class="profile-container">
    <section class="profile-card">
      <div class="profile-image">
        <img id="profile-pic" src="https://via.placeholder.com/120" alt="Profile Picture" />
        <input type="file" id="profile-upload" style="display: none;" accept="image/*" />
        <label for="profile-upload" class="upload-label">Change Photo</label>
      </div>

      <div class="profile-details">
        <label>Full Name</label>
        <input type="text" id="name" />

        <label>Email</label>
        <input type="email" id="email" />

        <label>Phone</label>
        <input type="tel" id="phone" />

        <label>Address</label>
        <textarea id="address"></textarea>

        <button class="update-btn" onclick="saveProfile()">Update Profile</button>
      </div>
    </section>
  </main>

  <!-- Optionally include your footer -->

  <script>
    // Load saved profile on page load
    window.onload = function () {
      const name = localStorage.getItem("profile_name");
      const email = localStorage.getItem("profile_email");
      const phone = localStorage.getItem("profile_phone");
      const address = localStorage.getItem("profile_address");
      const pic = localStorage.getItem("profile_pic");

      if (name) document.getElementById("name").value = name;
      if (email) document.getElementById("email").value = email;
      if (phone) document.getElementById("phone").value = phone;
      if (address) document.getElementById("address").value = address;
      if (pic) document.getElementById("profile-pic").src = pic;
    };

    function saveProfile() {
      localStorage.setItem("profile_name", document.getElementById("name").value);
      localStorage.setItem("profile_email", document.getElementById("email").value);
      localStorage.setItem("profile_phone", document.getElementById("phone").value);
      localStorage.setItem("profile_address", document.getElementById("address").value);
      alert("Profile updated successfully!");
    }

    document.getElementById("profile-upload").addEventListener("change", function () {
      const file = this.files[0];
      const reader = new FileReader();

      reader.onloadend = function () {
        document.getElementById("profile-pic").src = reader.result;
        localStorage.setItem("profile_pic", reader.result);
      };

      if (file) {
        reader.readAsDataURL(file);
      }
    });
  </script>
</body>
</html>
